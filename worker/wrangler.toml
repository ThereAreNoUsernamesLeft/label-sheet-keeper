# Cloudflare Worker settings. GitHub deploys this from main after every check passes
# (.github/workflows/test-and-deploy.yml), using the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
name = "api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Labels sent from phones wait here until the panel picks them up (7 days at most).
# No id: Wrangler creates the namespace on the first deploy and keeps it linked.
[[kv_namespaces]]
binding = "LABELS"
