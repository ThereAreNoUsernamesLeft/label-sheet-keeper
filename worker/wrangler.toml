# Cloudflare Worker settings. GitHub deploys this from main after every check passes
# (.github/workflows/test-and-deploy.yml), using the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
name = "api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# No ids below: Wrangler creates each on the first deploy and keeps it linked.

# Mailboxes and the labels waiting in them (always up to date).
[[d1_databases]]
binding = "DB"
database_name = "label-sheet-keeper"

# The labels' files, written once and read once; they expire after 7 days.
[[kv_namespaces]]
binding = "LABELS"
